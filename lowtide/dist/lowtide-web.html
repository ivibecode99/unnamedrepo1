<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LOWTIDE</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0c0b14;color:#f4ebd0;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#0c0b14;z-index:5;cursor:pointer;text-align:center;padding:16px}
#start h1{font-size:34px;letter-spacing:6px;margin:0;color:#f2a33c}
#start p{margin:0;opacity:.8}
#pad{position:fixed;left:0;right:0;bottom:0;height:34vmin;display:none;z-index:3;pointer-events:none}
.touch #pad{display:block}

</style></head>
<body>
