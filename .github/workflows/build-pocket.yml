name: Build Pocket Edition (GBA / GB / GBC)
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["pocket/**", ".github/workflows/build-pocket.yml"]
    tags: ["v*"]
jobs:
  gb-gbc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GBDK-2020
        run: |
          curl -fsSL -o /tmp/gbdk.tgz https://github.com/gbdk-2020/gbdk-2020/releases/download/4.3.0/gbdk-linux64.tar.gz
          tar xzf /tmp/gbdk.tgz -C "$HOME"
          echo "GBDK_HOME=$HOME/gbdk" >> "$GITHUB_ENV"
      - run: make -C pocket/gb all
      - name: Emulator tests (PyBoy)
        run: |
          pip install pyboy pillow
          python3 pocket/tests/test_gb.py
      - uses: actions/upload-artifact@v4
        with: { name: captco-pocket-gb-gbc, path: "pocket/gb/build/*.gb*" }
  gba:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Butano
        run: git clone https://github.com/GValiente/butano.git /opt/butano && git -C /opt/butano checkout 67afc034335e2aa873091c6da20d9568984b8d0b
      - name: Build GBA ROM
        run: make -C pocket/gba -j2 LIBBUTANO=/opt/butano/butano
      - uses: actions/upload-artifact@v4
        with: { name: captco-pocket-gba, path: "pocket/gba/captco_pocket.*" }
  test-gba:
    needs: gba
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: captco-pocket-gba, path: pocket/gba }
      - name: Install emulator + tools
        run: sudo apt-get update && sudo apt-get install -y mgba-sdl xdotool imagemagick xvfb binutils-arm-none-eabi
      - name: mGBA end-to-end test
        run: |
          mkdir -p /tmp/shots
          xvfb-run -a -s "-screen 0 480x320x24" python3 pocket/tests/test_gba.py pocket/gba/captco_pocket.gba
