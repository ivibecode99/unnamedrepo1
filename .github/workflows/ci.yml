name: CI (tests)
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Import project
        run: godot --headless --path game --import
      - name: Run test suites
        run: godot --headless --path game res://tests/runner.tscn
